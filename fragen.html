<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fragen · Martins Flugbuch</title>
<meta name="description" content="Persönliches Flug-Logbuch seit 1985: Streckenkarte, Städte, Zeitzonen und Rekorde. / Personal flight log since 1985.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#122033; --ink2:#4a586a; --ink3:#77838f; --rule:#d8dee5; --grid:#e6eaef;
  --sea:#f6f8fa; --land:#dfe4ea; --land-v:#c3d0df; --land-line:#ffffff;
  --biz:#2a78d6; --priv:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --other:#b3bcc6;
  --strip:#f2b705; --strip-ink:#122033;
  --q1:#cde2fb; --q2:#9ec5f4; --q3:#6da7ec; --q4:#3987e5; --q5:#256abf; --q6:#184f95; --q7:#0d366b;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d131a; --panel:#141c26; --ink:#e6ebf0; --ink2:#a7b2be; --ink3:#788492; --rule:#263241; --grid:#1d2733;
    --sea:#111922; --land:#1f2a36; --land-v:#2d3e52; --land-line:#111922;
    --biz:#3987e5; --priv:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --other:#4a5664;
    --strip:#d9a404; --strip-ink:#0d131a;
    --q1:#1c2a3b; --q2:#184f95; --q3:#1c5cab; --q4:#256abf; --q5:#3987e5; --q6:#6da7ec; --q7:#b7d3f6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d131a; --panel:#141c26; --ink:#e6ebf0; --ink2:#a7b2be; --ink3:#788492; --rule:#263241; --grid:#1d2733;
  --sea:#111922; --land:#1f2a36; --land-v:#2d3e52; --land-line:#111922;
  --biz:#3987e5; --priv:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --other:#4a5664;
  --strip:#d9a404; --strip-ink:#0d131a;
  --q1:#1c2a3b; --q2:#184f95; --q3:#1c5cab; --q4:#256abf; --q5:#3987e5; --q6:#6da7ec; --q7:#b7d3f6;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:30px;line-height:1.1}
h3{font-size:20px}
p{margin:0}
.mono{font-family:var(--mono)}
.muted{color:var(--ink2)}
.small{font-size:13px;color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}

/* header strip */
.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:28px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.masthead h1{font-size:44px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.masthead .reg{align-items:center;font-family:var(--mono);font-size:13px;color:var(--ink2);display:flex;gap:18px;flex-wrap:wrap}
.masthead .reg b{color:var(--ink);font-weight:500}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:stretch}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero-main{display:flex;flex-direction:column;gap:14px;justify-content:center}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(64px,11vw,120px);line-height:.9;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big small{font-size:.34em;font-weight:600;letter-spacing:.02em;margin-left:.2em;color:var(--ink2)}
.lede{font-size:18px;max-width:54ch;color:var(--ink2)}
.lede b{color:var(--ink);font-weight:600}
.odo{display:flex;flex-direction:column;gap:10px}
.odo-row{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center}
.odo-row .lbl{font-family:var(--mono);font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.odo-bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;position:relative}
.odo-bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:4px}
.odo-row .val{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;min-width:4.5ch;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--rule);background:var(--panel);border-radius:6px;overflow:hidden}
.tile{padding:16px 18px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.tile:nth-child(2n){border-right:0}
.tile:nth-last-child(-n+2){border-bottom:0}
.tile .v{font-family:var(--display);font-size:36px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--ink2)}

/* sections */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.sec-head .intro{max-width:62ch;color:var(--ink2);margin-top:4px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--strip);color:var(--strip-ink);padding:2px 7px;border-radius:3px;align-self:flex-start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.grid-3-2{display:grid;grid-template-columns:3fr 2fr;gap:28px}
@media (max-width:860px){.grid2,.grid-3-2{grid-template-columns:1fr}}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.seg button{font:500 13px var(--body);background:transparent;color:var(--ink2);border:0;padding:6px 12px;cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:focus-visible,select:focus-visible{outline:2px solid var(--biz);outline-offset:2px}
select{font:500 13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:6px 10px}

.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.swl{width:16px;height:3px;border-radius:2px;display:inline-block}

.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--ink3);font:12px var(--body);font-variant-numeric:tabular-nums}
.axis line,.axis path{stroke:var(--rule)}
.gridl line{stroke:var(--grid)}
.map-wrap{position:relative;border-radius:4px;overflow:hidden;background:var(--sea);border:1px solid var(--rule)}
.hit{cursor:pointer}

/* zoom + nav */
.nss path{vector-effect:non-scaling-stroke}
.zbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zbtns button{width:34px;height:34px;border-radius:5px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);font:600 18px var(--body);cursor:pointer;line-height:1}
.zbtns button:focus-visible{outline:2px solid var(--biz);outline-offset:2px}
.zhint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,32,51,.55);color:#fff;font:500 15px var(--body);opacity:0;pointer-events:none;transition:opacity .2s;padding:16px;text-align:center}
.zhint.on{opacity:1}
.pages{display:flex;gap:4px;flex-wrap:wrap;width:100%;order:3;margin-top:6px}
.pages a{font:500 14px var(--body);color:var(--ink2);text-decoration:none;padding:6px 12px;border-radius:5px;border:1px solid transparent}
.pages a:hover{color:var(--ink);border-color:var(--rule)}
.pages a[aria-current="page"]{background:var(--ink);color:var(--panel)}
.pages a:focus-visible{outline:2px solid var(--biz);outline-offset:2px}
/* unterseiten */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button.chip{cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
button.chip:hover{border-color:var(--ink3)}
button.chip:focus-visible{outline:2px solid var(--biz);outline-offset:2px}
.globe-wrap{border-radius:4px;overflow:hidden;background:var(--sea);border:1px solid var(--rule);position:relative;touch-action:none}
#globe{width:100%}
.globe-fallback{padding:40px 20px;text-align:center;color:var(--ink2)}
.askbar{display:flex;gap:8px}
.askbar input{flex:1;min-width:0;font:400 17px var(--body);padding:12px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink)}
.askbar input:focus-visible,.filter:focus-visible{outline:2px solid var(--biz);outline-offset:1px}
.askbar button{font:600 15px var(--body);padding:0 18px;border:0;border-radius:6px;background:var(--ink);color:var(--panel);cursor:pointer}
.answer{display:flex;flex-direction:column;gap:10px;font-size:16px}
.answer:empty{display:none}
.answer .qline{font-family:var(--mono);font-size:12px;color:var(--ink3);text-transform:none}
.answer p{max-width:70ch}
.rank{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:4px;max-width:520px}
.rank li{counter-increment:r;display:grid;grid-template-columns:28px 1fr auto;gap:8px;border-bottom:1px solid var(--grid);padding:4px 0;font-variant-numeric:tabular-nums}
.rank li::before{content:counter(r);color:var(--ink3);font-family:var(--mono);font-size:12px;padding-top:2px}
.filter{font:400 14px var(--body);padding:8px 12px;border:1px solid var(--rule);border-radius:5px;background:var(--bg);color:var(--ink);min-width:0;width:min(320px,100%)}
.sortable th button{all:unset;cursor:pointer;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.sortable th button:hover{color:var(--ink)}
.sortable th button:focus-visible{outline:2px solid var(--biz)}
/* tooltip */
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--panel);font:13px var(--body);padding:8px 10px;border-radius:5px;max-width:260px;z-index:10;opacity:0;transition:opacity .08s;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tip b{font-family:var(--display);font-size:18px;font-weight:600;display:block;line-height:1.1}
#tip .t2{opacity:.8}

/* city list */
.cities{display:flex;flex-direction:column;gap:6px}
.crow{display:grid;grid-template-columns:120px 1fr 132px;gap:10px;align-items:center;font-size:14px}
.crow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .bar{height:14px;display:flex;gap:2px}
.crow .bar i{display:block;height:100%;border-radius:0 3px 3px 0}
.crow .bar i:first-child{border-radius:3px 0 0 3px}
.crow .bar i:only-child{border-radius:3px}
.crow .vv{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px;text-align:right;white-space:nowrap}
.crow .vv b{color:var(--ink);font-weight:600}
@media (max-width:520px){.crow{grid-template-columns:92px 1fr 104px}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;background:var(--bg);white-space:nowrap}
.chip .mono{font-size:12px;color:var(--ink2);margin-left:4px}
.hub{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.hub span:nth-child(2n){font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right}

/* stat line */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.callout{border:1px solid var(--rule);border-left:4px solid var(--strip);background:var(--bg);border-radius:4px;padding:10px 14px;max-width:80ch}
.fact{border-left:3px solid var(--strip);padding:2px 0 2px 12px;display:flex;flex-direction:column}
.fact .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.fact .k{font-size:13px;color:var(--ink2)}

/* records */
.records{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0;border-top:1px solid var(--rule)}
.rec{padding:14px 12px 14px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.rec .ic{font-family:var(--mono);font-size:11px;color:var(--strip-ink);background:var(--strip);border-radius:3px;text-align:center;padding:3px 0;margin-top:4px;letter-spacing:.04em}
.rec .k{font-size:13px;color:var(--ink2)}
.rec .v{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.15}
.rec .d{font-size:13px;color:var(--ink2)}

/* cabin */
.cabin{display:flex;flex-direction:column;gap:14px}
.fuselage{border:2px solid var(--ink);border-radius:60px 60px 18px 18px/40px 40px 14px 14px;padding:26px 14px 14px;display:flex;justify-content:safe center;gap:14px;overflow-x:auto}
.block{display:flex;gap:4px}
.seatc{width:44px;display:flex;flex-direction:column;align-items:center;gap:4px}
.seatc .s{width:40px;height:46px;border-radius:8px 8px 5px 5px;display:flex;align-items:flex-end;justify-content:center;font:600 13px var(--display);padding-bottom:4px;position:relative}
.seatc .s::before{content:"";position:absolute;left:5px;right:5px;top:-6px;height:9px;border-radius:5px 5px 2px 2px;background:inherit;filter:brightness(.92)}
.seatc .l{font-family:var(--mono);font-size:13px;font-weight:500}
@media (max-width:520px){.seatc{width:24px}.seatc .s{width:23px;height:32px;font-size:10px;border-radius:6px 6px 4px 4px}.seatc .s::before{left:3px;right:3px}.seatc .l{font-size:11px}.fuselage{gap:6px;padding:22px 8px 10px}.block{gap:2px}}

/* board */
.board{width:100%;border-collapse:collapse;font-size:14px}
.board th{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule)}
.board td{padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap;font-variant-numeric:tabular-nums}
.board td.code{font-family:var(--mono);font-weight:500}
.tblwrap{overflow-x:auto}
details summary{cursor:pointer;font-size:13px;color:var(--ink2)}
details table{margin-top:8px}
footer{font-size:13px;color:var(--ink3);max-width:80ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 data-i="title"></h1>
    <nav class="pages" aria-label="Seiten"><a href="./" data-i="navHome"></a><a href="globus.html" data-i="navGlobe"></a><a href="fragen.html" aria-current="page" data-i="navAsk"></a></nav>
    <div class="reg">
      <span><span data-i="homebase"></span> <b>VIE</b></span><span><span data-i="asof"></span> <b id="asof"></b></span>
      <div class="seg" id="langSeg" role="group" aria-label="Sprache / Language"><button data-v="de" aria-pressed="true" lang="de">DE</button><button data-v="en" aria-pressed="false" lang="en">EN</button></div>
    </div>
  </header>

  <section class="card ask">
    <div><h2 data-i="askH"></h2><p class="intro" data-i="askIntro"></p></div>
    <form id="askForm" class="askbar" autocomplete="off">
      <label for="q" class="vh" data-i="askLabel"></label>
      <input id="q" type="search" enterkeyhint="search">
      <button type="submit" data-i="askBtn"></button>
    </form>
    <div class="chips" id="examples"></div>
    <div id="answer" class="answer" aria-live="polite"></div>
  </section>

  <section class="card">
    <div class="sec-head">
      <div><h2 data-i="listH"></h2><p class="intro" id="listIntro"></p></div>
      <div class="controls"><label for="filter" class="vh" data-i="filterLabel"></label><input id="filter" type="search" class="filter"></div>
    </div>
    <div class="tblwrap"><table class="board sortable" id="list"></table></div>
    <div class="controls" id="pager"></div>
  </section>

  <footer data-i="footer"></footer>
</div>
<div id="tip" role="status" aria-live="polite"></div>

const acAlias=a=>{const m=a.match(/(Airbus|Boeing) (\d{3})/);if(m)return [a,(m[1][0])+m[2],m[2],m[1]+' '+m[2]];const e=a.match(/Embraer (\d{3})/);if(e)return [a,'E'+e[1],'ERJ'+e[1],'Embraer '+e[1]];if(/McDonnell/.test(a))return [a,'MD-83','MD83','MD-80','MD80'];if(a==='Canadair')return [a,'CRJ'];if(a==='Dash 8')return [a,'DHC-8','Dash8','Q400'];return [a]};
for(const a of new Set(P.filter(f=>f.ac).map(f=>f.ac))){addE('ac',a,acAlias(a),f=>f.ac===a,()=>a)}
for(const r of new Set(P.filter(f=>f.reg).map(f=>f.reg))){addE('reg',r,[r,r.replace('-','')],f=>f.reg===r,()=>r)}

function findEntities(q){
  const n=' '+norm(q).replace(/[?!.,;:()"„“”]/g,' ')+' ';const raw=q;const found=[];
  for(const e of ent){
    for(const nm of e.names){
      if(nm.length<2)continue;
      if(e.type==='ap'){ if(new RegExp('(^|[^A-Za-z])'+e.key+'([^A-Za-z]|$)').test(raw)){found.push({e,pos:n.indexOf(nm),len:3});break} continue }
      if(e.type==='al'&&nm.length<4&&!/[A-Z]/.test(raw))continue;
      const re=new RegExp('[^a-z0-9]'+nm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[^a-z0-9]');
      if(re.test(n)){found.push({e,pos:n.indexOf(nm),len:nm.length});break}
    }
  }
  // längste Treffer bevorzugen, Überlappungen entfernen
  found.sort((a,b)=>b.len-a.len);const out=[];
  for(const f of found){if(out.some(o=>f.pos<o.pos+o.len&&o.pos<f.pos+f.len&&!(f.e.type==='ap'&&o.e.type==='city')))continue;out.push(f)}
  const order={reg:0,ac:1,ap:2,city:3,cty:4,al:5};
  return out.sort((a,b)=>order[a.e.type]-order[b.e.type]).map(f=>f.e);
}
function parseDate(q){
  let m=q.match(/\b(\d{1,2})[./](\d{1,2})[./](\d{4})\b/);if(m)return {d:`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`};
  m=q.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);if(m)return {d:m[0]};
  const M=[...T.de.months,...T.en.months,'Januar','Feber','Maerz','Mrz','Jan','Feb','Apr','Jun','Jul','Aug','Sep','Sept','Okt','Oct','Nov','Dez','Dec'].map(x=>norm(x));const MI=[...Array(24).keys()].map(i=>i%12).concat([0,1,2,2,0,1,3,5,6,7,8,8,9,9,10,11,11]);const nq=norm(q);
  for(let i=0;i<M.length;i++){const mi=MI[i];const re1=new RegExp('\\b(\\d{1,2})\\.?\\s+'+M[i]+'\\s+(\\d{4})');const re2=new RegExp(M[i]+'\\s+(\\d{1,2})(st|nd|rd|th)?,?\\s+(\\d{4})');const re3=new RegExp('\\b'+M[i]+'\\s+(\\d{4})');
    let x=nq.match(re1);if(x)return {d:`${x[2]}-${String(mi+1).padStart(2,'0')}-${x[1].padStart(2,'0')}`};
    x=nq.match(re2);if(x)return {d:`${x[3]}-${String(mi+1).padStart(2,'0')}-${x[1].padStart(2,'0')}`};
    x=nq.match(re3);if(x)return {m:`${x[1]}-${String(mi+1).padStart(2,'0')}`,mi,y:x[1]};}
  m=q.match(/\b(\d{1,2})\/(\d{4})\b/);if(m)return {m:`${m[2]}-${m[1].padStart(2,'0')}`,mi:+m[1]-1,y:m[2]};
  return null;
}
const years=q=>[...q.matchAll(/\b(19[89]\d|20[0-4]\d)\b/g)].map(m=>+m[1]);
const topN=q=>{const m=q.match(/\b(\d{1,3})\b/);const n=m&&!years(q).includes(+m[1])&&!/\d{1,2}[./]\d/.test(q)?+m[1]:10;return Math.max(1,Math.min(50,n))};

/* ---------- Antworten ---------- */
const kmS=n=>nf(n)+' km', durS=m=>m?`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')} h`:'';
function flightTable(list,extra){
  if(!list.length)return '';
  const rows=list.slice(0,60).map(f=>`<tr><td>${dfmt(f.d)}</td><td><span class="mono">${f.f}</span> ${esc(fcN(f))}</td><td><span class="mono">${f.t}</span> ${esc(tcN(f))}</td><td class="code">${esc(f.fn||'')}</td><td>${esc(f.al)}</td><td>${esc(f.ac||'')}</td><td class="num">${kmS(f.km)}</td>${extra?`<td>${extra(f)}</td>`:''}</tr>`).join('');
  return `<div class="tblwrap"><table class="board"><tr><th>${t('cols')[0]}</th><th>${t('cols')[1]}</th><th>${t('cols')[2]}</th><th>${t('cols')[3]}</th><th>${t('cols')[4]}</th><th>${t('cols')[5]}</th><th>km</th>${extra?'<th></th>':''}</tr>${rows}</table></div>${list.length>60?`<p class="small">+ ${list.length-60}</p>`:''}`;
}
function rankList(pairs,fmt){return `<ol class="rank">${pairs.map(([k,v])=>`<li><span>${esc(k)}</span><b>${fmt?fmt(v):v}</b></li>`).join('')}</ol>`}
function answer(q){
  const nq=norm(q);const L=Object.fromEntries(Object.keys(T.de.kws).map(k=>[k,{test:x=>T.de.kws[k].test(x)||T.en.kws[k].test(x)}]));const has=re=>re.test(nq);
  const ents=findEntities(q);const dt=parseDate(q);const ys=years(q);
  const yFilter=ys.length?(f=>ys.includes(f.y)):(()=>true);
  const rFilter=has(L.biz)?(f=>f.biz):has(L.priv)?(f=>!f.biz):(()=>true);
  const base=flown.filter(f=>yFilter(f)&&rFilter(f));
  // 1. Datum
  if(dt&&dt.d){const on=flown.filter(f=>f.d===dt.d);const ds=dfmt(dt.d);
    if(on.length)return `<p>${t('onDate')(ds,on.length)}</p>${flightTable(on)}`;
    const before=flown.filter(f=>f.d<dt.d).pop();let s=`<p>${t('noDate')(ds)}</p>`;
    if(before)s+=`<p>${t('whereDate')(ds,esc(tcN(before)),dfmt(before.ad||before.d))}</p>`;
    const near=[...flown].sort((a,b)=>Math.abs(new Date(a.d)-new Date(dt.d))-Math.abs(new Date(b.d)-new Date(dt.d))).slice(0,4).sort((a,b)=>a.d<b.d?-1:1);
    return s+`<p class="small">${t('near')}</p>${flightTable(near)}`}
  if(dt&&dt.m){const list=flown.filter(f=>f.d.startsWith(dt.m));return `<p>${t('month')(`${t('months')[dt.mi]} ${dt.y}`,list.length)}</p>${flightTable(list)}`}
  // 2. Ranglisten
  const n=topN(q);
  if(has(L.long)&&has(L.dur)||(has(L.dur)&&!ents.length&&!has(L.count))){const l=[...base].filter(f=>f.min).sort((a,b)=>b.min-a.min).slice(0,n);return `<p>${t('topDur')(l.length)}</p>${flightTable(l,f=>durS(f.min))}`}
  if(has(L.long)&&!ents.length){const l=[...base].sort((a,b)=>b.km-a.km).slice(0,n);return `<p>${t('topLong')(l.length)}</p>${flightTable(l)}`}
  if(has(L.short)&&!ents.length){const l=[...base].filter(f=>f.f!==f.t).sort((a,b)=>a.km-b.km).slice(0,n);return `<p>${t('topShort')(l.length)}</p>${flightTable(l)}`}
  if(!ents.length&&(has(L.top)||has(L.count))){
    const cnt=(fn)=>{const m=new Map();for(const f of base)for(const k of [].concat(fn(f)))m.set(k,(m.get(k)||0)+1);return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n)};
    if(has(L.routes))return `<p>${t('topRoutes')}</p>`+rankList(cnt(f=>[f.f,f.t].sort().join(' – ')));
    if(has(L.ap))return `<p>${t('topAp')}</p>`+rankList(cnt(f=>[f.f,f.t]));
    if(has(L.al))return `<p>${t('topAl')}</p>`+rankList(cnt(f=>alN(f.al)));
    if(has(L.ac))return `<p>${t('topAc')}</p>`+rankList(cnt(f=>f.ac||'—'));
    if(has(L.cty))return `<p>${t('topCty')}</p>`+rankList(cnt(f=>[...new Set([lang==='de'?f.tl:f.tle,lang==='de'?f.fl:f.fle])].filter(c=>c!==(lang==='de'?'Österreich':'Austria'))));
  }
  // 3. Erster/letzter Flug ohne Ziel
  if(!ents.length&&has(L.first)&&!has(L.long)){const f=base[0];return `<p>${t('firstFlight')}</p>${flightTable([f])}`}
  if(!ents.length&&has(L.last)){const f=base[base.length-1];return `<p>${t('lastFlight')}</p>${flightTable([f])}`}
  // 4. Entität
  if(ents.length){
    const e=ents[0];const list=base.filter(e.test);const lab=e.label();
    if(!list.length)return `<p>${t('none')}</p>`;
    const ft=dfmt(list[0].d),lt=dfmt(list[list.length-1].d);
    if(has(L.last))return `<p>${t('last')(esc(lab),lt)}</p>${flightTable(list.slice(-3).reverse())}`;
    if(has(L.first))return `<p>${t('first')(esc(lab),ft)}</p>${flightTable(list.slice(0,1))}`;
    let head='';
    if(e.type==='ap'){const a=AP[e.key];const n2=list.reduce((s,f)=>s+(f.f===e.key)+(f.t===e.key),0);head=t('apCount')(e.key,esc(cityN(a)),n2,ft,lt)}
    else if(e.type==='city'){const v=S.visits.find(x=>x.city===e.key)||{stays:0,nights:0,transit:0};head=v.stays?t('cityCount')(esc(lab),v.stays,v.nights,list.length,v.transit):t('cityTransit')(esc(lab),v.transit,list.length)}
    else if(e.type==='cty')head=t('ctyCount')(esc(lab),list.length,ft,lt);
    else if(e.type==='al')head=t('alCount')(esc(lab),list.length,nf(list.reduce((s,f)=>s+f.km,0)),ft,lt);
    else if(e.type==='ac')head=t('acCount')(esc(lab),list.length,ft,lt);
    else if(e.type==='reg')head=t('regCount')(esc(lab),esc(list[0].ac||''),list.length);
    return `<p>${head}</p>${flightTable([...list].reverse())}`;
  }
  // 5. Jahres- oder Gesamtzahlen
  if(ys.length||has(L.km)||has(L.count)){
    if(ys.length){return ys.map(y=>{const l=flown.filter(f=>f.y===y&&rFilter(f));const c=new Set(l.flatMap(f=>[f.fl,f.tl])).size;return `<p>${t('yearStats')(y,l.length,nf(l.reduce((s,f)=>s+f.km,0)),l.filter(f=>f.biz).length,l.filter(f=>!f.biz).length,nf(l.reduce((s,f)=>s+(f.min||0),0)/60),c)}</p>`}).join('')}
    const c=new Set(base.flatMap(f=>[f.fl,f.tl])).size,a=new Set(base.flatMap(f=>[f.f,f.t])).size;
    return `<p>${t('totals')(nf(base.length),nf(base.reduce((s,f)=>s+f.km,0)),nf(base.reduce((s,f)=>s+(f.min||0),0)/60),c,a)}</p>`;
  }
  if(has(L.first)){return `<p>${t('firstFlight')}</p>${flightTable([flown[0]])}`}
  return `<p>${t('none')}</p>`;
}

/* ---------- Flugliste ---------- */
let sortK='d',sortDir=-1,shown=100,filt='';
const keys=['d','f','t','fn','al','ac','reg','km','min','cls','biz'];
function rowText(f){return norm([f.d,dfmt(f.d),f.f,f.t,f.fc,f.tc,f.fce,f.tce,f.fl,f.tl,f.fle,f.tle,f.fn,f.al,f.ac,f.reg,f.cls,f.biz?t('bizW'):t('privW')].join(' '))}
function drawList(){
  const terms=norm(filt).split(/\s+/).filter(Boolean);
  let l=flown.filter(f=>{const tx=rowText(f);return terms.every(w=>tx.includes(w))});
  l.sort((a,b)=>{const x=a[sortK]??'',y=b[sortK]??'';return (x<y?-1:x>y?1:0)*sortDir});
  const c=t('cols');
  el('list').innerHTML=`<tr>${c.map((h,i)=>`<th><button type="button" data-k="${keys[i]}">${h}${sortK===keys[i]?(sortDir>0?' ▲':' ▼'):''}</button></th>`).join('')}</tr>`+
    l.slice(0,shown).map(f=>`<tr><td>${dfmt(f.d)}</td><td><span class="mono">${f.f}</span> ${esc(fcN(f))}</td><td><span class="mono">${f.t}</span> ${esc(tcN(f))}</td><td class="code">${esc(f.fn||'')}</td><td>${esc(f.al)}</td><td>${esc(f.ac||'')}</td><td class="code">${esc(f.reg||'')}</td><td class="num">${nf(f.km)}</td><td class="num">${durS(f.min)}</td><td>${esc(f.cls||'')}</td><td>${f.biz?t('bizW'):t('privW')}</td></tr>`).join('');
  el('listIntro').textContent=t('listIntro')(nf(l.length),filt);
  el('pager').innerHTML=l.length>shown?`<button type="button" class="chip" id="more">${t('more')(Math.min(100,l.length-shown))}</button>`:'';
  const m=el('more');if(m)m.onclick=()=>{shown+=100;drawList()};
}
el('list').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;const k=b.dataset.k;if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=(k==='d'||k==='km'||k==='min')?-1:1}drawList()});
el('filter').addEventListener('input',e=>{filt=e.target.value;shown=100;drawList()});

function ask(q){if(!q.trim()){el('answer').innerHTML='';return}el('answer').innerHTML=`<div class="qline">„${esc(q)}“</div>`+answer(q)}
el('askForm').addEventListener('submit',e=>{e.preventDefault();ask(el('q').value)});
el('examples').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;el('q').value=b.textContent;ask(b.textContent)});
function drawAll(){drawCommon();el('q').placeholder=t('placeholder');el('filter').placeholder=t('filterPh');
  el('examples').innerHTML=t('ex').map(x=>`<button type="button" class="chip">${esc(x)}</button>`).join('');
  drawList();if(el('q').value)ask(el('q').value)}
onLang(drawAll);drawAll();
</script>
